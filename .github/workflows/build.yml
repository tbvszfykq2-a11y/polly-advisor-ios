name: Build IPA

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions: {}

jobs:
  ipa:
    uses: Jeho974/ipa-build-template/.github/workflows/build-unsigned-ipa.yml@main
    permissions:
      contents: write        # REQUIRED: reusable workflow creates the Release
    with:
      kind: xcodegen         # xcode | xcodegen | swiftpm | flutter
      project_dir: .
      app_name: PollyAdvisor        # must match target name in project.yml
      bundle_id: com.hermes.pollyadvisor
      # scheme: PollyAdvisor        # defaults to app_name
      # configuration: Release
      source_name: PollyAdvisor (unsigned builds)
      icon_url: https://raw.githubusercontent.com/tbvszfykq2-a11y/polly-advisor-ios/main/Sources/PollyAdvisor/Assets.xcassets/AppIcon.appiconset/icon-1024.png
