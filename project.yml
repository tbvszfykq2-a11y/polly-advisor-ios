name: PollyAdvisor
options:
  bundleIdPrefix: com.hermes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  PollyAdvisor:
    type: application
    platform: iOS
    sources:
      - path: Sources/PollyAdvisor
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Polly Advisor
        # XcodeGen writes literal 1.0/1 by default, which silently ignores the
        # build settings above. Reference them so the built IPA reports the
        # real version and builds are distinguishable on device.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Polly Advisor connects to your advisor server on the WireGuard
          network to read live market signals.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermes.pollyadvisor
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

# Declare the scheme explicitly; do not rely on auto-generation.
schemes:
  PollyAdvisor:
    build:
      targets:
        PollyAdvisor: all
    run:
      config: Release
    archive:
      config: Release
